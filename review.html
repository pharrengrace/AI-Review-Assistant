<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simmons Family Dentistry - AI Review Assistant</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f9fc;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #e3ecf3;
    }

    h1 {
      font-size: 22px;
      color: #0b4a6f;
      margin-bottom: 8px;
    }

    p {
      color: #5f6b76;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* STEPS */
    .steps {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .step {
      flex: 1;
      background: #f5f9fc;
      border: 1px solid #e3ecf3;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2c3e50;
    }

    .num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #2b7bbb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d9e2ec;
      margin-top: 10px;
      font-size: 14px;
      resize: none;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      background: #2b7bbb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1f5f93;
    }

    .box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #e3ecf3;
    }

    .secondary {
      background: white;
      color: #2b7bbb;
      border: 1px solid #2b7bbb;
    }

    .secondary:hover {
      background: #f0f8ff;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="header-image">
    <img src="header.jpg" alt="Simmons Family Dentistry Office">
  </div>

  <h1> Simmons Family Dentistry</h1>

  <p>
    Share your experience in seconds. We’ll help you improve your review before posting it to Google.
  </p>

  <!-- STEPS -->
  <div class="steps">
    <div class="step"><span class="num">1</span>Write</div>
    <div class="step"><span class="num">2</span>Improve</div>
    <div class="step"><span class="num">3</span>Post</div>
  </div>

  <!-- INPUT -->
  <label><strong>Your Review</strong></label>
  <textarea id="input" placeholder="Example: The staff was friendly and my visit was quick and comfortable..."></textarea>

  <!-- ACTION -->
  <button onclick="generate()">✨ Improve My Review</button>

  <!-- OUTPUT -->
  <div class="box" id="output"></div>

  <!-- ACTION BUTTONS -->
  <button id="copyBtn" style="display:none;" onclick="copyText()">
    📋 Copy Review
  </button>

  <button id="googleBtn" style="display:none;" onclick="goGoogle()" class="secondary">
    ⭐ Leave Google Review
  </button>

</div>

<script>
let latestReview = "";

async function generate() {
  const text = document.getElementById("input").value;

  const res = await fetch("/api/google-reviews", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });

  const data = await res.json();

  latestReview = data.improved || "No response received.";

  document.getElementById("output").innerText = latestReview;

  document.getElementById("copyBtn").style.display = "block";
  document.getElementById("googleBtn").style.display = "block";
}

function copyText() {
  navigator.clipboard.writeText(latestReview);
  alert("Copied! Now paste it into Google Reviews.");
}

function goGoogle() {
  window.location.href =
    "https://search.google.com/local/writereview?placeid=ChIJDU7R8RMM3IARnMfbJzw6uZo";
}
</script>

</body>
</html>
